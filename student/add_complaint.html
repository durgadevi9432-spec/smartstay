<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Complaint | SmartStay</title>

    <link
        rel="stylesheet"
        href="../static/css/student.css"
    >

</head>

<body data-page="add-complaint">

<aside class="sidebar">

    <div class="logo">
        🏢 <span>SmartStay</span>
    </div>

    <div class="menu-title">
        Menu
    </div>

    <a href="dashboard.html">
        📊 Dashboard
    </a>

    <a href="add_complaint.html" class="active">
        ➕ Add Complaint
    </a>

    <a href="my_complaints.html">
        📝 My Complaints
    </a>

    <a href="profile.html">
        👤 Profile
    </a>

    <a href="#" onclick="logoutStudent()">
        🚪 Logout
    </a>

</aside>


<main class="main-content">

    <header class="page-header">

        <h1>Add Complaint</h1>

        <p>
            Submit a new hostel complaint
        </p>

    </header>


    <section class="profile-card">

        <form id="complaintForm">

            <div class="form-group">

                <label for="category">
                    Complaint Category
                </label>

                <select id="category" required>

                    <option value="">
                        Select Category
                    </option>

                    <option value="Electrical">
                        Electrical
                    </option>

                    <option value="Plumbing">
                        Plumbing
                    </option>

                    <option value="Cleaning">
                        Cleaning
                    </option>

                    <option value="Room">
                        Room
                    </option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="title">
                    Complaint Title
                </label>

                <input
                    type="text"
                    id="title"
                    required
                    placeholder="Enter complaint title"
                >

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    rows="6"
                    required
                    placeholder="Describe your complaint"
                ></textarea>

            </div>


            <div class="form-group">

                <label for="priority">
                    Priority
                </label>

                <select id="priority" required>

                    <option value="Low">
                        Low
                    </option>

                    <option value="Medium" selected>
                        Medium
                    </option>

                    <option value="High">
                        High
                    </option>

                </select>

            </div>


            <button
                type="submit"
                class="btn-primary"
            >
                Submit Complaint
            </button>

        </form>

    </section>

</main>


<script src="../static/js/student.js"></script>

</body>

</html>
