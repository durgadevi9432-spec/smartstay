<!-- =================================================
     EDIT ROOM FORM
================================================== -->

<div class="form-card">

    <form id="editRoomForm">

        <div class="form-grid">


            <!-- ROOM NUMBER -->

            <div class="form-group">

                <label for="roomNumber">
                    Room Number
                </label>

                <input
                    type="text"
                    id="roomNumber"
                    placeholder="Enter room number"
                    required
                >

            </div>


            <!-- ROOM TYPE -->

            <div class="form-group">

                <label for="roomType">
                    Room Type
                </label>

                <select
                    id="roomType"
                    required
                >

                    <option value="">
                        Select Room Type
                    </option>

                    <option value="AC">
                        AC
                    </option>

                    <option value="Non-AC">
                        Non-AC
                    </option>

                </select>

            </div>


            <!-- CAPACITY -->

            <div class="form-group">

                <label for="roomCapacity">
                    Capacity
                </label>

                <select
                    id="roomCapacity"
                    required
                >

                    <option value="">
                        Select Capacity
                    </option>

                    <option value="1">
                        Single Sharing
                    </option>

                    <option value="2">
                        Double Sharing
                    </option>

                    <option value="3">
                        Triple Sharing
                    </option>

                    <option value="4">
                        Four Sharing
                    </option>

                    <option value="5">
                        Five Sharing
                    </option>

                </select>

            </div>


            <!-- FLOOR -->

            <div class="form-group">

                <label for="roomFloor">
                    Floor
                </label>

                <input
                    type="number"
                    id="roomFloor"
                    min="0"
                    placeholder="Enter floor number"
                    required
                >

            </div>


            <!-- STATUS -->

            <div class="form-group">

                <label for="roomStatus">
                    Status
                </label>

                <select
                    id="roomStatus"
                    required
                >

                    <option value="Available">
                        Available
                    </option>

                    <option value="Occupied">
                        Occupied
                    </option>

                    <option value="Maintenance">
                        Maintenance
                    </option>

                </select>

            </div>

        </div>


        <!-- MESSAGE -->

        <div
            id="editRoomMessage"
            class="form-message"
        ></div>


        <!-- ACTIONS -->

        <div class="form-actions">

            <a
                href="rooms.html"
                class="btn-secondary"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="btn-primary"
            >
                Save Changes
            </button>

        </div>

    </form>

</div>
