<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Staff | SmartStay</title>

    <link
        rel="stylesheet"
        href="../static/css/admin.css"
    >

</head>


<body>


<!-- =====================================================
     SIDEBAR
====================================================== -->

<aside class="sidebar">

    <div class="logo">
        🏢 SmartStay
    </div>


    <ul class="sidebar-menu">

        <li>
            <a href="dashboard.html">
                📊 Dashboard
            </a>
        </li>


        <li>
            <a href="students.html">
                👨‍🎓 Students
            </a>
        </li>


        <li class="active">
            <a href="staff.html">
                👨‍🔧 Staff
            </a>
        </li>


        <li>
            <a href="rooms.html">
                🏠 Rooms
            </a>
        </li>


        <li>
            <a href="complaints.html">
                📝 Complaints
            </a>
        </li>

    </ul>

</aside>


<!-- =====================================================
     MAIN CONTENT
====================================================== -->

<main class="main-content">


    <!-- PAGE HEADER -->

    <div class="page-header">

        <div>

            <h1>
                Add Staff
            </h1>

            <p>
                Add a new staff member to SmartStay
            </p>

        </div>


        <a
            href="staff.html"
            class="btn-secondary"
        >
            ← Back
        </a>

    </div>


    <!-- =================================================
         FORM
    ================================================== -->

    <div class="form-card">

        <form id="addStaffForm">


            <div class="form-grid">


                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="staffFullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="staffFullName"
                        placeholder="Enter staff full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="staffEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="staffEmail"
                        placeholder="Enter staff email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="staffPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="staffPassword"
                        placeholder="Enter password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="staffPhone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="staffPhone"
                        placeholder="Enter phone number"
                        maxlength="15"
                        required
                    >

                </div>


                <!-- STAFF TYPE -->

                <div class="form-group">

                    <label for="staffType">
                        Staff Type
                    </label>

                    <select
                        id="staffType"
                        required
                    >

                        <option value="">
                            Select Staff Type
                        </option>

                        <option value="Security">
                            Security
                        </option>

                        <option value="Warden">
                            Warden
                        </option>

                        <option value="Cleaner">
                            Cleaner
                        </option>

                        <option value="Maintenance">
                            Maintenance
                        </option>

                        <option value="Cook">
                            Cook
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- GENDER -->

                <div class="form-group">

                    <label for="staffGender">
                        Gender
                    </label>

                    <select
                        id="staffGender"
                        required
                    >

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- ADDRESS -->

                <div class="form-group full-width">

                    <label for="staffAddress">
                        Address
                    </label>

                    <textarea
                        id="staffAddress"
                        rows="4"
                        placeholder="Enter staff address"
                        required
                    ></textarea>

                </div>

            </div>


            <!-- =================================================
                 MESSAGE
            ================================================== -->

            <div
                id="staffFormMessage"
                class="form-message"
            ></div>


            <!-- =================================================
                 ACTIONS
            ================================================== -->

            <div class="form-actions">

                <a
                    href="staff.html"
                    class="btn-secondary"
                >
                    Cancel
                </a>


                <button
                    type="submit"
                    class="btn-primary"
                >
                    Add Staff
                </button>

            </div>

        </form>

    </div>

</main>


<!-- =====================================================
     ADMIN JAVASCRIPT
====================================================== -->

<script src="../static/js/admin.js"></script>
<script src="../static/js/staff.js"></script>


</body>

</html>
