<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>View Staff | SmartStay</title>

    <link
        rel="stylesheet"
        href="../static/css/admin.css"
    >

</head>


<body>


<!-- =====================================================
     SIDEBAR
====================================================== -->

<aside class="sidebar">

    <div class="logo">
        🏢 SmartStay
    </div>


    <ul class="sidebar-menu">

        <li>
            <a href="dashboard.html">
                📊 Dashboard
            </a>
        </li>


        <li>
            <a href="students.html">
                👨‍🎓 Students
            </a>
        </li>


        <li class="active">
            <a href="staff.html">
                👨‍🔧 Staff
            </a>
        </li>


        <li>
            <a href="rooms.html">
                🏠 Rooms
            </a>
        </li>


        <li>
            <a href="complaints.html">
                📝 Complaints
            </a>
        </li>

    </ul>

</aside>


<!-- =====================================================
     MAIN CONTENT
====================================================== -->

<main class="main-content">


    <!-- PAGE HEADER -->

    <div class="page-header">

        <div>

            <h1>
                Staff Details
            </h1>

            <p>
                View staff member information
            </p>

        </div>


        <a
            href="staff.html"
            class="btn-secondary"
        >
            ← Back to Staff
        </a>

    </div>


    <!-- =================================================
         STAFF DETAILS
    ================================================== -->

    <div class="form-card">


        <div class="form-grid">


            <!-- STAFF ID -->

            <div class="form-group">

                <label>
                    Staff ID
                </label>

                <input
                    type="text"
                    id="viewStaffId"
                    readonly
                >

            </div>


            <!-- FULL NAME -->

            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="viewStaffName"
                    readonly
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    id="viewStaffEmail"
                    readonly
                >

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label>
                    Phone Number
                </label>

                <input
                    type="text"
                    id="viewStaffPhone"
                    readonly
                >

            </div>


            <!-- STAFF TYPE -->

            <div class="form-group">

                <label>
                    Staff Type
                </label>

                <input
                    type="text"
                    id="viewStaffType"
                    readonly
                >

            </div>


            <!-- GENDER -->

            <div class="form-group">

                <label>
                    Gender
                </label>

                <input
                    type="text"
                    id="viewStaffGender"
                    readonly
                >

            </div>


            <!-- ROLE -->

            <div class="form-group">

                <label>
                    Role
                </label>

                <input
                    type="text"
                    id="viewStaffRole"
                    readonly
                >

            </div>


            <!-- ADDRESS -->

            <div class="form-group full-width">

                <label>
                    Address
                </label>

                <textarea
                    id="viewStaffAddress"
                    rows="4"
                    readonly
                ></textarea>

            </div>

        </div>


        <!-- MESSAGE -->

        <div
            id="viewStaffMessage"
            class="form-message"
        ></div>


        <!-- ACTIONS -->

        <div class="form-actions">

            <a
                href="assign_staff.html"
                class="btn-primary"
            >
                Assign Staff
            </a>


            <a
                href="staff.html"
                class="btn-secondary"
            >
                ← Back
            </a>

        </div>

    </div>

</main>


<!-- =====================================================
     ADMIN JAVASCRIPT
====================================================== -->

<script src="../static/js/admin.js"></script>
<script src="../static/js/staff.js"></script>


</body>

</html>
