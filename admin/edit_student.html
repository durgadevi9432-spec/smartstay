<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Student | SmartStay</title>

    <link rel="stylesheet"
          href="../static/css/admin.css">

</head>


<body>

<!-- =====================================================
     SIDEBAR
====================================================== -->

<aside class="sidebar">

    <div class="logo">
        🏢 SmartStay
    </div>

    <ul class="sidebar-menu">

        <li>
            <a href="dashboard.html">
                📊 Dashboard
            </a>
        </li>

        <li class="active">
            <a href="students.html">
                👨‍🎓 Students
            </a>
        </li>

        <li>
            <a href="staff.html">
                👨‍🔧 Staff
            </a>
        </li>

        <li>
            <a href="rooms.html">
                🏠 Rooms
            </a>
        </li>

        <li>
            <a href="complaints.html">
                📝 Complaints
            </a>
        </li>

    </ul>

</aside>


<!-- =====================================================
     MAIN CONTENT
====================================================== -->

<main class="main-content">

    <div class="dashboard">

        <!-- =================================================
             PAGE HEADER
        ================================================== -->

        <div class="page-header">

            <div>
                <h1>✏️ Edit Student</h1>

                <p>
                    Update student information
                </p>
            </div>

            <div class="page-actions">

                <a href="students.html"
                   class="btn-secondary">
                    ← Back to Students
                </a>

            </div>

        </div>


        <!-- =================================================
             FORM CARD
        ================================================== -->

        <div class="form-card">

            <form id="editStudentForm">

                <div class="form-grid">

                    <!-- STUDENT ID -->

                    <div class="form-group">

                        <label for="studentId">
                            Student ID
                        </label>

                        <input
                            type="text"
                            id="studentId"
                            readonly
                        >

                        <small>
                            Student ID cannot be changed.
                        </small>

                    </div>


                    <!-- FULL NAME -->

                    <div class="form-group">

                        <label for="editFullName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="editFullName"
                            placeholder="Enter full name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="editEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="editEmail"
                            placeholder="Enter email address"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="editPassword">
                            New Password
                        </label>

                        <input
                            type="password"
                            id="editPassword"
                            placeholder="Enter new password"
                            minlength="6"
                        >

                        <small>
                            Leave blank to keep the current password.
                        </small>

                    </div>


                    <!-- PHONE -->

                    <div class="form-group">

                        <label for="editPhone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="editPhone"
                            placeholder="Enter phone number"
                            maxlength="15"
                            required
                        >

                    </div>


                    <!-- DATE OF BIRTH -->

                    <div class="form-group">

                        <label for="editDob">
                            Date of Birth
                        </label>

                        <input
                            type="date"
                            id="editDob"
                            required
                        >

                    </div>


                    <!-- GENDER -->

                    <div class="form-group">

                        <label for="editGender">
                            Gender
                        </label>

                        <select
                            id="editGender"
                            required
                        >

                            <option value="">
                                Select Gender
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- ROLE -->

                    <div class="form-group">

                        <label for="editRole">
                            Role
                        </label>

                        <input
                            type="text"
                            id="editRole"
                            value="student"
                            readonly
                        >

                    </div>


                    <!-- ADDRESS -->

                    <div class="form-group full-width">

                        <label for="editAddress">
                            Address
                        </label>

                        <textarea
                            id="editAddress"
                            rows="4"
                            placeholder="Enter student's address"
                            required
                        ></textarea>

                    </div>

                </div>


                <!-- =================================================
                     MESSAGE
                ================================================== -->

                <div
                    id="editStudentMessage"
                    class="form-message">
                </div>


                <!-- =================================================
                     FORM ACTIONS
                ================================================== -->

                <div class="form-actions">

                    <a
                        href="students.html"
                        class="btn-secondary">
                        ✕ Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn-primary">
                        ✓ Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>

</main>


<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script src="../static/js/admin.js"></script>
<script src="../static/js/edit_student.js"></script>

</body>

</html>
