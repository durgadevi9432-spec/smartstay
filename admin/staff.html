<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Staff | SmartStay</title>

    <link
        rel="stylesheet"
        href="../static/css/admin.css"
    >

</head>


<body>


<!-- =====================================================
     SIDEBAR
====================================================== -->

<aside class="sidebar">

    <div class="logo">
        🏢 SmartStay
    </div>


    <ul class="sidebar-menu">

        <li>
            <a href="dashboard.html">
                📊 Dashboard
            </a>
        </li>


        <li>
            <a href="students.html">
                👨‍🎓 Students
            </a>
        </li>


        <li class="active">
            <a href="staff.html">
                👨‍🔧 Staff
            </a>
        </li>


        <li>
            <a href="rooms.html">
                🏠 Rooms
            </a>
        </li>


        <li>
            <a href="complaints.html">
                📝 Complaints
            </a>
        </li>

    </ul>

</aside>


<!-- =====================================================
     MAIN CONTENT
====================================================== -->

<main class="main-content">


    <!-- PAGE HEADER -->

    <div class="page-header">

        <div>

            <h1>
                Staff Management
            </h1>

            <p>
                Manage hostel staff members
            </p>

        </div>


        <a
            href="add_staff.html"
            class="btn-primary"
        >
            + Add Staff
        </a>

    </div>


    <!-- =================================================
         STAFF TABLE
    ================================================== -->

    <div class="table-card">

        <div class="table-header">

            <h2>

                Staff Members
                (<span id="staffTotal">0</span>)

            </h2>


            <input
                type="text"
                id="staffSearch"
                class="search-input"
                placeholder="Search by name or email..."
            >

        </div>


        <div class="table-responsive">

            <table>

                <thead>

                    <tr>

                        <th>#</th>

                        <th>Name</th>

                        <th>Email</th>

                        <th>Phone</th>

                        <th>Staff Type</th>

                        <th>Gender</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="staffTable">

                    <tr>

                        <td
                            colspan="7"
                            class="empty-message"
                        >
                            Loading staff...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>


<!-- =====================================================
     ADMIN JAVASCRIPT
====================================================== -->

<script src="../static/js/admin.js"></script>
<script src="../static/js/staff.js"></script>


</body>

</html>
