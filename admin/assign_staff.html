<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Assign Staff | SmartStay</title>

    <link
        rel="stylesheet"
        href="../static/css/admin.css"
    >

</head>


<body>


<!-- =====================================================
     SIDEBAR
====================================================== -->

<aside class="sidebar">

    <div class="logo">
        🏢 SmartStay
    </div>

    <ul class="sidebar-menu">

        <li>
            <a href="dashboard.html">
                📊 Dashboard
            </a>
        </li>

        <li>
            <a href="students.html">
                👨‍🎓 Students
            </a>
        </li>

        <li>
            <a href="staff.html">
                👨‍🔧 Staff
            </a>
        </li>

        <li>
            <a href="rooms.html">
                🏠 Rooms
            </a>
        </li>

        <li class="active">
            <a href="complaints.html">
                📝 Complaints
            </a>
        </li>

    </ul>

</aside>



<!-- =====================================================
     MAIN CONTENT
====================================================== -->

<main class="main-content">


    <!-- PAGE HEADER -->

    <div class="page-header">

        <div>

            <h1>
                Assign Staff
            </h1>

            <p>
                Assign a staff member to a complaint
            </p>

        </div>


        <a
            href="complaints.html"
            class="btn-secondary"
        >
            ← Back
        </a>

    </div>



    <!-- FORM CARD -->

    <div class="form-card">

        <form id="assignStaffForm">


            <!-- FORM GRID -->

            <div class="form-grid">


                <!-- COMPLAINT -->

                <div class="form-group full-width">

                    <label for="assignComplaint">
                        Complaint
                    </label>

                    <select
                        id="assignComplaint"
                        required
                    >

                        <option value="">
                            Select complaint
                        </option>

                    </select>

                </div>



                <!-- STAFF -->

                <div class="form-group">

                    <label for="assignStaff">
                        Staff Member
                    </label>

                    <select
                        id="assignStaff"
                        required
                    >

                        <option value="">
                            Select staff
                        </option>

                    </select>

                </div>





                <!-- NOTES -->

                <div class="form-group full-width">

                    <label for="assignmentNotes">
                        Notes
                    </label>

                    <textarea
                        id="assignmentNotes"
                        rows="5"
                        placeholder="Enter assignment notes..."
                    ></textarea>

                </div>

            </div>



            <!-- MESSAGE -->

            <div
                id="assignStaffMessage"
                class="form-message"
            ></div>



            <!-- ACTIONS -->

            <div class="form-actions">

                <a
                    href="complaints.html"
                    class="btn-secondary"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn-primary"
                    id="assignButton"
                >
                    Assign Staff
                </button>

            </div>


        </form>

    </div>


</main>



<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script src="../static/js/assign_staff.js"></script>


</body>

</html>
